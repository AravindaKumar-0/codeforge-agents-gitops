
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: codeforge-agents-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AravindaKumar-0/codeforge-agents-gitops.git
    targetRevision: main
    path: apps/codeforge-agents
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

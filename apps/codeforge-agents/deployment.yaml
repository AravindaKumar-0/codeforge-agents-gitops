
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeforge-agents
  labels:
    app: codeforge-agents
    team: forge-platform
spec:
  replicas: 4
  selector:
    matchLabels:
      app: codeforge-agents
  template:
    metadata:
      labels:
        app: codeforge-agents
        team: forge-platform
    spec:
      containers:
        - name: codeforge-agents
          image: imaravinda/codeforge-agents:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - secretRef:
                name: codeforge-secrets
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
